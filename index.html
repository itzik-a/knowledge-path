<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Knowledge Hub">
<meta name="theme-color" content="#F6F5F3" media="(prefers-color-scheme: light)" data-for="light">
<meta name="theme-color" content="#0C0B0A" media="(prefers-color-scheme: dark)" data-for="dark">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-crimson-180.png">
<link rel="manifest" href="./manifest.webmanifest">
<script>
/* Light or dark before the first paint: this device's choice, else the system's. src/lib/theme.ts does the same afterwards.
   The accent too, from the copy src/state/appearance.ts keeps of the vault's choice (Crimson and Graphite also change the page colour). */
(function () {
  var a; try { a = localStorage.getItem("knowledgePath.accent"); } catch (e) {}
  if (a && /^[a-z]+$/.test(a)) {
    document.documentElement.dataset.accent = a;
    document.querySelector('link[rel="icon"]').href = "./icons/icon-" + a + ".svg";
    document.querySelector('link[rel="manifest"]').href = "./manifest-" + a + ".webmanifest";
    var pg = { crimson: ["#F7F7F8", "#1C1D20"], graphite: ["#F3F5F7", "#1F2022"] }[a];
    if (pg) document.querySelectorAll('meta[name="theme-color"][data-for]').forEach(function (m) { m.content = pg[m.dataset.for === "dark" ? 1 : 0]; });
  }
  /* the Aa panel's choices (src/lib/reading.ts) */
  var r; try { r = JSON.parse(localStorage.getItem("knowledgePath.reading") || "{}") || {}; } catch (e) { r = {}; }
  var ds = document.documentElement.dataset, SIZES = [14, 15, 16, 17, 18, 20, 22];
  if (/^(newyork|iowan|rounded)$/.test(r.font)) ds.font = r.font;
  if (SIZES[r.size] && r.size !== 2) ds.size = String(SIZES[r.size]);
  if (/^(tight|relaxed)$/.test(r.spacing)) ds.spacing = r.spacing;
  if (r.align === "justify") ds.align = r.align;
  if (/^(narrow|wide|full)$/.test(r.width)) ds.width = r.width;
  var t; try { t = localStorage.getItem("knowledgePath.theme"); } catch (e) {}
  if (t !== "light" && t !== "sepia" && t !== "dark") return void (document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.dataset.theme = t;
  document.querySelectorAll('meta[name="theme-color"][data-for]').forEach(function (m) {
    if (t === "sepia") m.content = "#F2E8CF";
    m.media = m.dataset.for === (t === "sepia" ? "light" : t) ? "all" : "not all";
  });
})();
</script>
<title>Knowledge Hub</title>
</head>
<body>
<div id="root"></div>
<script type="module" src="./src/main.tsx"></script>
</body>
</html>
