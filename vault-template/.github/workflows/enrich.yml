name: Enrich

# Fills in saved links and answers Explore requests, using the enricher in the (public) knowledge-path
# repo. Runs after every push that adds or changes a resource or a request (the app's sync, the iOS
# Shortcut, Obsidian), once a day to retry, and by hand. Its own commits don't start it again.
# Claude needs the ANTHROPIC_API_KEY repository secret; without it, it only reads the pages.
on:
  push:
    branches: [main]
    paths: ["Resources/**", ".hub/requests/**"]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enrich
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: itzik-a/knowledge-path
          path: .app
      - uses: actions/setup-node@v7
        with:
          node-version-file: .app/.nvmrc
          cache: npm
          cache-dependency-path: .app/package-lock.json
      - run: npm ci --prefix .app --no-audit --no-fund
      - name: Fill in links, answer Explore
        run: node .app/enricher/run.ts --vault .
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit
        run: |
          git config user.name "Knowledge Path enricher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A  # .app (the checked-out app) is in .gitignore
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -q -m "Enrich: $(git diff --cached --name-only | grep -c '^Resources/') resources"
          for i in 1 2 3 4; do
            git pull -q --rebase && git push -q && exit 0
            sleep $((i * 5))
          done
          exit 1
